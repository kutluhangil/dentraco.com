.req{animation:req 12s cubic-bezier(.3,1.3,.5,1) infinite}
@keyframes req{0%{opacity:0;transform:translateY(-14px)}56.7%{opacity:0;transform:translateY(-14px)}59.6%{opacity:1;transform:none}81.7%{opacity:1;transform:none}84.6%{opacity:0;transform:translateY(-14px)}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
