<rect class="t" x="492" y="2" width="10" height="24" rx="5" fill="#2D4BFF" style="animation-delay:.3s"/>
<rect class="t" x="507" y="2" width="10" height="24" rx="5" fill="#8EDCC6" style="animation-delay:.45s"/>
