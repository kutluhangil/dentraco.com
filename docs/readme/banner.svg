<style>
.t{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.25,1,.5,1) forwards}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.tooth{fill:#fff;stroke:#b9c8c5;stroke-width:1.2}
.sel{fill:#2D4BFF;stroke:#1f36cc;stroke-width:1.2;animation:blink 3s 2.4s ease-in-out infinite}
@keyframes blink{0%,100%{fill:#2D4BFF}50%{fill:#6f84ff}}
.title{font:700 92px Figtree, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;letter-spacing:-4px;fill:#0F2A33;opacity:0;animation:rise .9s .1s cubic-bezier(.25,1,.5,1) forwards}
.sub{font:500 24px Figtree, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#4A6470;opacity:0;animation:rise .9s .45s cubic-bezier(.25,1,.5,1) forwards}
.note{font:500 15px Figtree, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif;fill:#7D939B;opacity:0;animation:rise .9s .8s forwards}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.tab{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .5s cubic-bezier(.25,1,.5,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.blob{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-40px,30px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style>
